description: >-
  Aarhus University (Aarhus Universitet) is a public research university in Aarhus,
  Denmark, founded in 1928, with roughly 38,000 students across five faculties. It
  operates no central developer portal, no public API program, and no
  general-purpose institutional API — api.au.dk, data.au.dk, developer.au.dk and
  opendata.au.dk do not resolve. Its one genuinely institution-operated,
  publicly readable machine-readable surface is the OAI-PMH metadata harvesting
  service at pure.au.dk/ws/oai, which is live and fully functional: it identifies
  itself as the Aarhus University repository, is administered from pure@au.dk,
  offers five metadata profiles including the Danish national research-database
  formats, and emits ORCID iDs for Aarhus researchers. Everything else in the
  university's programmable footprint is a vendor's product running under the
  institution's name — the Elsevier Pure research information REST API at
  pure.au.dk/ws/api (gated, HTTP 401 without a key, and an Elsevier contract
  regardless of the host it is served from), the Semestry MyTimetable service at
  timetable.au.dk, and the ERDA/MiG research data archive at erda.au.dk. The
  kursuskatalog.au.dk course catalogue and the mitstudie.au.dk student
  self-service environment are web applications with no documented API.
  Aarhus is a member of WAYF, Denmark's national identity federation, and
  operates a SAML identity provider scoped to au.dk behind it. Code activity
  lives in departmental GitHub organisations such as cs-au-dk rather than in any
  central engineering programme.
