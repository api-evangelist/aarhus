  x-operator: institution
  description: >-
    kursuskatalog.au.dk is Aarhus University's public course catalogue, built
    and operated by the university on its own domain and served through AU's own
    CDN and font hosts. It is a web application only. There is no documented
    API, no JSON surface, and no real sitemap — a request for /sitemap.xml
