  detail: >-
    Every surface class the university pipeline hunts was probed on 2026-08-30
    and the result is a thin but complete and honest profile. Aarhus University
    operates exactly one public, readable, institution-operated machine-readable
    API: the OAI-PMH 2.0 harvesting service at pure.au.dk/ws/oai, which is fully
    functional across Identify, ListMetadataFormats, ListSets and ListRecords and
    carries ORCID iDs for Aarhus researchers. There is no central developer
    portal and no open-data portal — api.au.dk, data.au.dk, developer.au.dk,
    open.au.dk, opendata.au.dk and services.au.dk all return NXDOMAIN. The
    course catalogue and student self-service systems are web-only; their
    /sitemap.xml is a soft-404 returning the application shell. Timetabling is
    Semestry MyTimetable and the research data archive is the University of
    Copenhagen's ERDA/MiG platform, both deployed on au.dk hosts and both
    recorded as tenant relationships. Identity federation is real and was
    confirmed in the WAYF national federation aggregate, which carries au.dk as
    a Shibboleth metadata scope. GenomeDK, the university's HPC facility, is
    documented across 78 pages but exposes no API. This profile previously
    carried 37 OpenAPI definitions and 128 derived artifacts; all of them were
    the Elsevier Pure product contract (info.title "Pure API", contact
    pure-support@elsevier.com, version 5.35.3-4) split per tag, and all were
    removed in this run. Expect the score to fall, because the artifact volume
    it was resting on was never Aarhus University's.
