apis:
- aid: aarhus:pure-oai
  name: Aarhus University OAI-PMH Metadata Service
  x-operator: institution
  description: >-
    Open Archives Initiative Protocol for Metadata Harvesting 2.0 service for
    Aarhus University's research record. Verified live on 2026-08-30: the
    Identify verb returns repositoryName "Aarhus University", adminEmail
    pure@au.dk and an earliest datestamp of 2005-06-02. Five metadata prefixes
    are offered — oai_dc, mods, fi-person, ddf-mxd and xmetadiss — the last two
    being the Danish national research database (Forskningsdatabasen) profiles,
    and the document declares the OpenAIRE CERIF 1.2 profile namespace. Records
    are partitioned into persons:all, publications:all, publications:withFiles
    and a per-year series from 1961 forward, and ListRecords returns real
    Dublin Core with Aarhus authors' ORCID iDs inline. The repository software
    beneath is Elsevier Pure, but the harvesting endpoint is served from the
    university's own registrable domain, administered from an au.dk address,
    and names Aarhus University as the repository — operating it is an
    institutional act, so this surface is credited to Aarhus.
  humanURL: https://pure.au.dk/portal/
  baseURL: https://pure.au.dk/ws/oai
