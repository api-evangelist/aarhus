  name: Aarhus University ERDA Research Data Archive
  x-operator: tenant
  description: >-
    erda.au.dk is Aarhus University's Electronic Research Data Archive, running
    on the university's own infrastructure with AU and external user sign-in
    paths and companion hosts at int.erda.au.dk, cert.erda.au.dk and
    ext.erda.au.dk. The platform is the MiG / ERDA software originating at the
    University of Copenhagen's SCIENCE faculty — the deployment still carries the
    erda-ucph-science skin and credits The MiG Project — so the archive is
    Aarhus's data on another institution's platform. No public API surface was
