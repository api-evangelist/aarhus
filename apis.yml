- aid: aarhus:pure-rest
  name: Elsevier Pure REST API — Aarhus University deployment
  x-operator: tenant
  description: >-
    Aarhus University's deployment of the Elsevier Pure research information
    system REST API. The data is Aarhus's — its researchers, projects, research
    outputs and organisational units — and the deployment runs on the
    university's own host. The CONTRACT is not Aarhus's: the served OpenAPI
    declares info.title "Pure API", info.contact.email pure-support@elsevier.com
    and version 5.35.3-4, and the same document is shipped by at least ten other
    institutions in this catalog. No copy of that specification is kept in this
    repository, because saving it here would credit Aarhus University with
    Elsevier's engineering — this is the exact misattribution the university
    pipeline exists to prevent. The endpoint itself is credentialed: an
    unauthenticated request to /ws/api/524.0/persons returns HTTP 401 "Full
    authentication is required to access this resource". The specification is
    publicly readable at https://pure.au.dk/ws/api/openapi.json for anyone who
    wants to inspect the product, and it belongs in Elsevier's own profile.
  humanURL: https://pure.au.dk/portal/
